<!DOCTYPE html>
<!-- slide #01 · type: title (cover) -->
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 01 · 교리, 한 흐름으로 다시 보기</title>
<link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { interpolate-size: allow-keywords; }

  /* ===== MONTAGE THEMES (wds-theme tokens) ===== */
  html.theme-light {
    --bg: #F7F7F8; --surface: #FFFFFF; --surface-hover: #F4F4F5;
    --border: rgba(112,115,124,0.22);
    --text: #171719; --text-secondary: #5A5C63;
    --accent: #0066FF; --accent-secondary: #70737C;
    --accent-strong: #005EEB; --accent-soft: #EAF2FE;
    --positive: #00BF40; --negative: #FF4242; --warning: #FF9200;
    --shadow-sm: 0 2px 4px -2px rgba(23,23,23,0.06), 0 4px 6px -1px rgba(23,23,23,0.05);
    --shadow-md: 0 4px 6px -2px rgba(23,23,23,0.07), 0 10px 15px -3px rgba(23,23,23,0.07);
    --shadow-lg: 0 6px 10px -4px rgba(23,23,23,0.08), 0 16px 24px -6px rgba(23,23,23,0.08);
  }
  html.theme-dark {
    --bg: #1B1C1E; --surface: #212225; --surface-hover: #2E2F33;
    --border: rgba(112,115,124,0.30);
    --text: #F7F7F8; --text-secondary: #AEB0B6;
    --accent: #3385FF; --accent-secondary: #989BA2;
    --accent-strong: #1A75FF; --accent-soft: rgba(51,133,255,0.16);
    --positive: #1ED45A; --negative: #FF6363; --warning: #FFA938;
    --shadow-sm: 0 2px 4px -2px rgba(0,0,0,0.40), 0 4px 6px -1px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 6px -2px rgba(0,0,0,0.45), 0 10px 15px -3px rgba(0,0,0,0.40);
    --shadow-lg: 0 8px 14px -4px rgba(0,0,0,0.55), 0 18px 28px -8px rgba(0,0,0,0.45);
  }

  html, body { width: 1280px; height: 720px; }
  body {
    font-family: 'Wanted Sans Variable', 'Wanted Sans', 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em; overflow: hidden; word-break: keep-all;
  }
  h1, h2, h3, h4 { color: var(--text); line-height: 1.2; letter-spacing: -0.03em; }
  em { font-style: normal; color: var(--accent); font-weight: 700; }

  /* ===== ARTBOARD ===== */
  .artboard { position: relative; width: 1280px; height: 720px; overflow: hidden; }

  /* cover background atmosphere */
  .cover-bg {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(820px 520px at 24% -8%, rgba(0,102,255,0.13), transparent 62%),
      linear-gradient(180deg, #FFFFFF 0%, #F1F6FF 56%, #F7F7F8 100%);
  }
  html.theme-dark .cover-bg {
    background:
      radial-gradient(820px 520px at 24% -8%, rgba(51,133,255,0.22), transparent 62%),
      linear-gradient(180deg, #23262B 0%, #1B1C1E 58%, #161719 100%);
  }

  .cover {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 110px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px; align-self: flex-start;
    font-size: 17px; font-weight: 700; letter-spacing: 0.01em;
    color: var(--accent); background: var(--accent-soft);
    padding: 9px 18px; border-radius: 999px; margin-bottom: 34px;
  }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .cover h1 {
    font-size: 84px; font-weight: 800; line-height: 1.08; letter-spacing: -0.045em;
  }
  .cover h1 .hl { color: var(--accent); }
  .cover-rule { width: 60px; height: 4px; background: var(--accent); border-radius: 4px; margin: 36px 0 26px; }
  .cover-sub { font-size: 24px; color: var(--text-secondary); font-weight: 600; }
  .theme-tags { display: flex; gap: 10px; margin-top: 26px; }
  .theme-tags span {
    font-size: 17px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); padding: 8px 17px; border-radius: 999px;
  }

  /* scattered → converging six dots (teaser of overview) */
  .six { position: absolute; right: 96px; bottom: 72px; width: 360px; height: 300px; z-index: 1; }
  .six .num {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 18px;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-secondary); box-shadow: var(--shadow-sm);
  }
  .six .num.b { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); background: var(--accent-soft); }
  .six .conv { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 14%, transparent); }
  .six .ln { position: absolute; left: 50%; top: 50%; height: 1.5px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 42%, transparent), transparent); transform-origin: left center; opacity: 0.7; }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 70% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  .animate { animation: fadeInUp 0.7s ease-out both; }
  .delay-1 { animation-delay: 0.12s; } .delay-2 { animation-delay: 0.24s; }
  .delay-3 { animation-delay: 0.36s; } .delay-4 { animation-delay: 0.48s; }
  .six .num { animation: pop 0.6s ease-out both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ===== VIZ MENU ===== */
  .viz-menu { position: fixed; top: 16px; right: 16px; z-index: 9999; }
  .viz-menu-toggle { width: 42px; height: 42px; border-radius: 11px; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  .viz-menu-toggle:hover { background: var(--surface-hover); }
  .viz-menu-dropdown { position: absolute; top: 50px; right: 0; min-width: 188px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 8px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.18s; box-shadow: var(--shadow-lg); }
  .viz-menu-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .viz-menu-dropdown button { width: 100%; padding: 10px 13px; border: none; border-radius: 9px; background: transparent; color: var(--text); font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; }
  .viz-menu-dropdown button:hover { background: var(--surface-hover); }
  .skip-to-content { position: absolute; top: -50px; left: 6px; background: var(--accent); color: #fff; padding: 8px 12px; text-decoration: none; border-radius: 8px; z-index: 10000; }
  .skip-to-content:focus { top: 6px; }

  @media print { @page { size: 1280px 720px; margin: 0; } .viz-menu { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<a href="#main-content" class="skip-to-content">본문으로 건너뛰기</a>

<nav class="viz-menu" aria-label="유틸리티 메뉴">
  <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="메뉴 열기" aria-haspopup="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="viz-menu-dropdown" id="vizMenuDropdown" role="menu">
    <button onclick="cycleTheme()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg> 테마 전환</button>
    <button onclick="downloadImage()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PNG 저장</button>
    <button onclick="window.print()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> 인쇄 / PDF</button>
  </div>
</nav>

<main id="main-content">
<section class="artboard" aria-label="제목 슬라이드">
  <div class="cover-bg"></div>
  <div class="cover">
    <span class="eyebrow animate"><span class="dot"></span>교리설교 6강 · 복습 세션</span>
    <h1 class="animate delay-1">교리, 한 흐름으로<br><span class="hl">다시 보기</span></h1>
    <div class="cover-rule animate delay-2"></div>
    <p class="cover-sub animate delay-2">6번의 교리설교 — 한 페이지씩 다시</p>
    <div class="theme-tags animate delay-3">
      <span>교리</span><span>하나님</span><span>목적</span><span>사랑</span>
    </div>
  </div>

  <!-- 흩어진 6강이 하나로 모인다: 예고편 -->
  <div class="six" aria-hidden="true">
    <div class="conv"></div>
    <span class="ln" style="width:150px; transform: rotate(-150deg);"></span>
    <span class="ln" style="width:135px; transform: rotate(-95deg);"></span>
    <span class="ln" style="width:160px; transform: rotate(-40deg);"></span>
    <span class="ln" style="width:150px; transform: rotate(30deg);"></span>
    <span class="ln" style="width:140px; transform: rotate(95deg);"></span>
    <span class="ln" style="width:155px; transform: rotate(160deg);"></span>
    <span class="num b" style="left:24px; top:6px; animation-delay:.2s;">1</span>
    <span class="num" style="left:0; top:128px; animation-delay:.3s;">2</span>
    <span class="num b" style="left:62px; top:236px; animation-delay:.4s;">3</span>
    <span class="num" style="right:38px; top:222px; animation-delay:.5s;">4</span>
    <span class="num b" style="right:0; top:96px; animation-delay:.6s;">5</span>
    <span class="num" style="right:46px; top:0; animation-delay:.7s;">6</span>
  </div>
</section>
</main>

<script>
  var THEME_KEY = 'viz-theme';
  function applyTheme(t) { document.documentElement.className = 'theme-' + t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  function cycleTheme() { var cur = document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light'; applyTheme(cur === 'dark' ? 'light' : 'dark'); }
  function toggleMenu() { document.getElementById('vizMenuDropdown').classList.toggle('open'); }
  function downloadImage() {
    var node = document.querySelector('.artboard');
    if (typeof htmlToImage === 'undefined') return;
    htmlToImage.toPng(node, { pixelRatio: 2, width: 1280, height: 720 }).then(function (url) {
      var a = document.createElement('a'); a.download = 'slide-01.png'; a.href = url; a.click();
    });
  }
  (function () { try { var s = localStorage.getItem(THEME_KEY); if (s) applyTheme(s); } catch (e) {} })();
  document.addEventListener('click', function (e) { if (!e.target.closest('.viz-menu')) { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
</script>
</body>
</html>
