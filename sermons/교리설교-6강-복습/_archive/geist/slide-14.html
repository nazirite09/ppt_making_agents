<!DOCTYPE html>
<!-- slide #14 · type: 예화/본문 (4강 ② 솔로몬, 마음을 빼앗기다 · 왕상 11:3 봉독) -->
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 14 · 솔로몬, 마음을 빼앗기다</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { interpolate-size: allow-keywords; }
  html.theme-light {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-hover: #FAFAFA;
    --border: #EAEAEA;
    --text: #000000; --text-secondary: #666666;
    --accent: #000000; --accent-secondary: #8F8F8F;
    --accent-strong: #000000; --accent-soft: #F4F4F4;
    --positive: #45A557; --negative: #E5484D; --warning: #F5A623;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  }
  html.theme-dark {
    --bg: #000000; --surface: #0A0A0A; --surface-hover: #1A1A1A;
    --border: #1F1F1F;
    --text: #EDEDED; --text-secondary: #8F8F8F;
    --accent: #FFFFFF; --accent-secondary: #8F8F8F;
    --accent-strong: #FFFFFF; --accent-soft: #1A1A1A;
    --positive: #45A557; --negative: #E5484D; --warning: #F5A623;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
  }
  html, body { width: 1280px; height: 720px; }
  body { font-family: 'Geist', 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; overflow: hidden; word-break: keep-all; }
  h1, h2, h3, h4 { color: var(--text); line-height: 1.2; letter-spacing: -0.03em; }
  .artboard { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  .stage { position: relative; z-index: 1; height: 100%; padding: 60px 96px 56px; display: grid; grid-template-columns: 1.08fr 1fr; gap: 48px; align-items: stretch; }

  .col-l { display: flex; flex-direction: column; justify-content: center; }
  .chap-badge { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .chap-badge .cn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--accent); color: #fff; font-weight: 600; font-size: 18px; }
  .chap-badge .ct { font-size: 15px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 7px 15px; border-radius: 8px; }
  .h-title { font-size: 46px; font-weight: 600; line-height: 1.12; letter-spacing: -0.04em; }
  .h-title .hl { color: var(--accent); }

  .verse-main { margin-top: 22px; font-size: 28px; font-weight: 700; line-height: 1.4; letter-spacing: -0.025em; color: var(--text); }
  .verse-main .holy { color: var(--accent); }
  .verse-main .small { display: block; font-size: 19px; font-weight: 600; color: var(--text-secondary); margin-top: 10px; }
  .verse-src { margin-top: 12px; font-size: 15px; font-weight: 600; color: var(--text-secondary); }

  .col-r { display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  /* merimnao morpheme card */
  .morph { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-sm); padding: 26px 28px; }
  .morph .mk { font-size: 14px; font-weight: 700; letter-spacing: 0.03em; color: var(--accent-secondary); margin-bottom: 4px; }
  .morph .mword { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
  .morph .pieces { display: flex; align-items: stretch; gap: 12px; margin-top: 18px; }
  .piece { flex: 1; display: grid; place-items: center; min-height: 62px; text-align: center; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent); border-radius: 14px; padding: 12px 10px; }
  .piece .pt { font-size: 23px; font-weight: 600; color: var(--accent-strong); letter-spacing: -0.02em; }
  html.theme-dark .piece .pt { color: #E0E0E0; }
  .plus { font-size: 22px; font-weight: 600; color: var(--accent-secondary); flex: 0 0 auto; }
  .morph .mresult { margin-top: 16px; text-align: center; font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: -0.02em; }

  .conseq { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent-secondary); border-radius: 16px; padding: 18px 22px; box-shadow: var(--shadow-sm); }
  .conseq .ci { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-hover); color: var(--accent-secondary); display: grid; place-items: center; flex: 0 0 auto; }
  .conseq p { font-size: 16px; line-height: 1.45; color: var(--text-secondary); }
  .conseq p b { color: var(--text); font-weight: 700; }
  .conseq p .ref { color: var(--accent-secondary); font-weight: 700; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate { animation: fadeInUp 0.7s ease-out both; }
  .delay-1 { animation-delay: 0.14s; } .delay-2 { animation-delay: 0.28s; } .delay-3 { animation-delay: 0.42s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .viz-menu { position: fixed; top: 16px; right: 16px; z-index: 9999; }
  .viz-menu-toggle { width: 42px; height: 42px; border-radius: 11px; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  .viz-menu-toggle:hover { background: var(--surface-hover); }
  .viz-menu-dropdown { position: absolute; top: 50px; right: 0; min-width: 188px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 8px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.18s; box-shadow: var(--shadow-lg); }
  .viz-menu-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .viz-menu-dropdown button { width: 100%; padding: 10px 13px; border: none; border-radius: 9px; background: transparent; color: var(--text); font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; }
  .viz-menu-dropdown button:hover { background: var(--surface-hover); }
  .skip-to-content { position: absolute; top: -50px; left: 6px; background: var(--accent); color: #fff; padding: 8px 12px; text-decoration: none; border-radius: 8px; z-index: 10000; }
  .skip-to-content:focus { top: 6px; }
  @media print { @page { size: 1280px 720px; margin: 0; } .viz-menu { display: none; } }
</style>
</head>
<body>
<a href="#main-content" class="skip-to-content">본문으로 건너뛰기</a>
<nav class="viz-menu" aria-label="유틸리티 메뉴">
  <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="메뉴 열기" aria-haspopup="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="viz-menu-dropdown" id="vizMenuDropdown" role="menu">
    <button onclick="cycleTheme()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg> 테마 전환</button>
    <button onclick="downloadImage()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PNG 저장</button>
    <button onclick="window.print()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> 인쇄 / PDF</button>
  </div>
</nav>

<main id="main-content">
<section class="artboard" aria-label="4강 — 솔로몬, 마음을 빼앗기다">
  <div class="stage">
    <div class="col-l">
      <div class="chap-badge animate"><span class="cn">4</span><span class="ct">4강 · 비극 ① 분열</span></div>
      <h1 class="h-title animate">솔로몬,<br><span class="hl">마음을 빼앗기다</span></h1>
      <p class="verse-main animate delay-1">
        “솔로몬 왕이 … 이방의 많은 여인을 사랑하였으니”
        <span class="small">“그의 여인들이 왕의 <span class="holy">마음을 돌아서게</span> 하였더라”</span>
      </p>
      <p class="verse-src animate delay-1">열왕기상 11:1, 3 · 개역개정 — 통혼의 유익을 사랑함</p>
    </div>

    <div class="col-r">
      <div class="morph animate delay-2">
        <div class="mk">염려 = 헬라어로</div>
        <div class="mword">메림나오</div>
        <div class="pieces">
          <div class="piece"><div class="pt">나누다</div></div>
          <span class="plus" aria-hidden="true">+</span>
          <div class="piece"><div class="pt">마음</div></div>
        </div>
        <div class="mresult">= 마음이 나뉘다</div>
      </div>

      <div class="conseq animate delay-3">
        <span class="ci" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg></span>
        <p>“무엇을 먹을까 … 염려하지 말라 / <b>이것은 다 이방인들이 구하는 것</b>” <span class="ref">마 6:31-32</span> — 나뉜 마음은 이방인이 구하는 것으로 채워진다</p>
      </div>
    </div>
  </div>
</section>
</main>

<script>
  var THEME_KEY = 'viz-theme';
  function applyTheme(t) { document.documentElement.className = 'theme-' + t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  function cycleTheme() { var cur = document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light'; applyTheme(cur === 'dark' ? 'light' : 'dark'); }
  function toggleMenu() { document.getElementById('vizMenuDropdown').classList.toggle('open'); }
  function downloadImage() { var node = document.querySelector('.artboard'); if (typeof htmlToImage === 'undefined') return; htmlToImage.toPng(node, { pixelRatio: 2, width: 1280, height: 720 }).then(function (url) { var a = document.createElement('a'); a.download = 'slide-14.png'; a.href = url; a.click(); }); }
  (function () { try { var s = localStorage.getItem(THEME_KEY); if (s) applyTheme(s); } catch (e) {} })();
  document.addEventListener('click', function (e) { if (!e.target.closest('.viz-menu')) { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
</script>
</body>
</html>
