<!DOCTYPE html>
<!-- slide #16 · type: 대지 (5강 ① 다시 선포된 십계명, 그 울타리) -->
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 16 · 5강 · 다시 선포된 십계명, 그 울타리</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { interpolate-size: allow-keywords; }
  html.theme-light {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-hover: #FAFAFA;
    --border: #EAEAEA;
    --text: #000000; --text-secondary: #666666;
    --accent: #000000; --accent-secondary: #8F8F8F;
    --accent-strong: #000000; --accent-soft: #F4F4F4;
    --positive: #45A557; --negative: #E5484D; --warning: #F5A623;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  }
  html.theme-dark {
    --bg: #000000; --surface: #0A0A0A; --surface-hover: #1A1A1A;
    --border: #1F1F1F;
    --text: #EDEDED; --text-secondary: #8F8F8F;
    --accent: #FFFFFF; --accent-secondary: #8F8F8F;
    --accent-strong: #FFFFFF; --accent-soft: #1A1A1A;
    --positive: #45A557; --negative: #E5484D; --warning: #F5A623;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
  }
  html, body { width: 1280px; height: 720px; }
  body { font-family: 'Geist', 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; overflow: hidden; word-break: keep-all; }
  h1, h2, h3, h4 { color: var(--text); line-height: 1.2; letter-spacing: -0.03em; }
  .artboard { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  .chap-index { position: absolute; z-index: 0; right: -10px; top: -64px; font-size: 420px; font-weight: 600; line-height: 1; color: var(--accent); opacity: 0.06; letter-spacing: -0.05em; user-select: none; }
  .stage { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 1fr 470px; gap: 50px; padding: 66px 96px 60px; align-items: center; }

  .chap-badge { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .chap-badge .cn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: #fff; font-weight: 600; font-size: 19px; }
  .chap-badge .ct { font-size: 16px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 7px 15px; border-radius: 8px; }
  .h-title { font-size: 46px; font-weight: 600; line-height: 1.14; letter-spacing: -0.04em; }
  .h-title .hl { color: var(--accent); }

  /* 신명기 어원 dual chips */
  .etym { margin-top: 22px; display: flex; gap: 12px; }
  .ety { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 18px; box-shadow: var(--shadow-sm); }
  .ety .ek { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-secondary); }
  .ety .ev { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; margin-top: 1px; }
  .ety .ev .han { color: var(--accent); }
  .ety .em { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }

  .blist { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; max-width: 600px; }
  .bitem { display: flex; gap: 14px; align-items: flex-start; }
  .bdot { flex: 0 0 auto; margin-top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .btext { font-size: 19px; line-height: 1.5; color: var(--text); }
  .btext strong { font-weight: 700; color: var(--accent-strong); }
  .btext .sub { display: block; font-size: 15px; color: var(--text-secondary); margin-top: 1px; }

  /* 울타리 = 10 기둥 + 장막 */
  .fence-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-sm); padding: 28px 30px 26px; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .fence-card .fk { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-secondary); text-transform: uppercase; }
  .fence-vis { position: relative; height: 168px; }
  .fence-vis svg { width: 100%; height: 100%; }
  .fence-legend { display: flex; gap: 18px; }
  .fence-legend .fl { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .fence-legend .fl .sw { width: 14px; height: 14px; border-radius: 4px; }
  .fence-legend .fl.pillar { color: var(--text); }
  .fence-legend .fl.canopy { color: var(--accent); }
  .fence-tag { font-size: 16px; line-height: 1.45; color: var(--text-secondary); }
  .fence-tag b { color: var(--accent); font-weight: 700; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate { animation: fadeInUp 0.7s ease-out both; }
  .delay-1 { animation-delay: 0.12s; } .delay-2 { animation-delay: 0.24s; } .delay-3 { animation-delay: 0.36s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .viz-menu { position: fixed; top: 16px; right: 16px; z-index: 9999; }
  .viz-menu-toggle { width: 42px; height: 42px; border-radius: 11px; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  .viz-menu-toggle:hover { background: var(--surface-hover); }
  .viz-menu-dropdown { position: absolute; top: 50px; right: 0; min-width: 188px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 8px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.18s; box-shadow: var(--shadow-lg); }
  .viz-menu-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .viz-menu-dropdown button { width: 100%; padding: 10px 13px; border: none; border-radius: 9px; background: transparent; color: var(--text); font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; }
  .viz-menu-dropdown button:hover { background: var(--surface-hover); }
  .skip-to-content { position: absolute; top: -50px; left: 6px; background: var(--accent); color: #fff; padding: 8px 12px; text-decoration: none; border-radius: 8px; z-index: 10000; }
  .skip-to-content:focus { top: 6px; }
  @media print { @page { size: 1280px 720px; margin: 0; } .viz-menu { display: none; } }
</style>
</head>
<body>
<a href="#main-content" class="skip-to-content">본문으로 건너뛰기</a>
<nav class="viz-menu" aria-label="유틸리티 메뉴">
  <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="메뉴 열기" aria-haspopup="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="viz-menu-dropdown" id="vizMenuDropdown" role="menu">
    <button onclick="cycleTheme()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg> 테마 전환</button>
    <button onclick="downloadImage()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PNG 저장</button>
    <button onclick="window.print()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> 인쇄 / PDF</button>
  </div>
</nav>

<main id="main-content">
<section class="artboard" aria-label="5강 — 다시 선포된 십계명, 그 울타리">
  <div class="chap-index" aria-hidden="true">5</div>
  <div class="stage">
    <div class="col-text">
      <div class="chap-badge animate"><span class="cn">5</span><span class="ct">5강 · 십계명의 배경</span></div>
      <h1 class="h-title animate">다시 선포된<br>십계명, 그 <span class="hl">울타리</span></h1>

      <div class="etym animate delay-1">
        <div class="ety">
          <div class="ek">헬라어</div>
          <div class="ev">듀테로노미</div>
          <div class="em">두 번째 율법 (Deuteronomy)</div>
        </div>
        <div class="ety">
          <div class="ek">한자</div>
          <div class="ev"><span class="han">申命記</span></div>
          <div class="em">거듭 명하신 말씀</div>
        </div>
      </div>

      <div class="blist animate delay-2">
        <div class="bitem"><span class="bdot"></span><p class="btext">시내산 → <strong>모압 평지</strong>에서 다시 — 출애굽 2세대에게<span class="sub">하나님 나라 확장의 사명을 이어갈 다음세대</span></p></div>
        <div class="bitem"><span class="bdot"></span><p class="btext">십계명 = 속박이 아니라, <strong>마음을 지키는 울타리</strong></p></div>
      </div>
    </div>

    <aside class="fence-card animate delay-2" aria-label="울타리 = 10개의 기둥 + 하나님 사랑의 장막">
      <div class="fk">울타리 = 10 기둥 + 사랑의 장막</div>
      <div class="fence-vis" aria-hidden="true">
        <svg viewBox="0 0 410 168" preserveAspectRatio="xMidYMid meet">
          <!-- canopy (love) -->
          <path d="M16 60 Q205 8 394 60" fill="none" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M16 60 Q205 8 394 60 L394 70 Q205 18 16 70 Z" fill="var(--accent)" opacity="0.12"/>
          <!-- 10 pillars -->
          <g stroke="var(--text-secondary)" stroke-width="7" stroke-linecap="round" opacity="0.9">
            <line x1="34" y1="58" x2="34" y2="150"/>
            <line x1="74" y1="55" x2="74" y2="150"/>
            <line x1="114" y1="52" x2="114" y2="150"/>
            <line x1="154" y1="50" x2="154" y2="150"/>
            <line x1="194" y1="49" x2="194" y2="150"/>
            <line x1="216" y1="49" x2="216" y2="150"/>
            <line x1="256" y1="50" x2="256" y2="150"/>
            <line x1="296" y1="52" x2="296" y2="150"/>
            <line x1="336" y1="55" x2="336" y2="150"/>
            <line x1="376" y1="58" x2="376" y2="150"/>
          </g>
          <!-- ground -->
          <line x1="16" y1="152" x2="394" y2="152" stroke="var(--border)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="fence-legend">
        <span class="fl pillar"><span class="sw" style="background:var(--accent-secondary);"></span>10개의 기둥 = 십계명</span>
        <span class="fl canopy"><span class="sw" style="background:var(--accent);"></span>감싸는 장막 = 사랑</span>
      </div>
      <div class="fence-tag">기둥이 마음을 둘러 지키고, 그 위를 <b>하나님의 사랑</b>이 덮습니다.</div>
    </aside>
  </div>
</section>
</main>

<script>
  var THEME_KEY = 'viz-theme';
  function applyTheme(t) { document.documentElement.className = 'theme-' + t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  function cycleTheme() { var cur = document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light'; applyTheme(cur === 'dark' ? 'light' : 'dark'); }
  function toggleMenu() { document.getElementById('vizMenuDropdown').classList.toggle('open'); }
  function downloadImage() { var node = document.querySelector('.artboard'); if (typeof htmlToImage === 'undefined') return; htmlToImage.toPng(node, { pixelRatio: 2, width: 1280, height: 720 }).then(function (url) { var a = document.createElement('a'); a.download = 'slide-16.png'; a.href = url; a.click(); }); }
  (function () { try { var s = localStorage.getItem(THEME_KEY); if (s) applyTheme(s); } catch (e) {} })();
  document.addEventListener('click', function (e) { if (!e.target.closest('.viz-menu')) { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
</script>
</body>
</html>
