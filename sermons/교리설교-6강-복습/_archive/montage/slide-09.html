<!DOCTYPE html>
<!-- slide #09 · type: 예화 (2강 ② 인생이라는 영화의 연출자) -->
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 09 · 내 인생이라는 영화의 연출자</title>
<link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { interpolate-size: allow-keywords; }
  html.theme-light {
    --bg: #F7F7F8; --surface: #FFFFFF; --surface-hover: #F4F4F5;
    --border: rgba(112,115,124,0.22);
    --text: #171719; --text-secondary: #5A5C63;
    --accent: #0066FF; --accent-secondary: #70737C;
    --accent-strong: #005EEB; --accent-soft: #EAF2FE;
    --positive: #00BF40; --negative: #FF4242; --warning: #FF9200;
    --shadow-sm: 0 2px 4px -2px rgba(23,23,23,0.06), 0 4px 6px -1px rgba(23,23,23,0.05);
    --shadow-md: 0 4px 6px -2px rgba(23,23,23,0.07), 0 10px 15px -3px rgba(23,23,23,0.07);
    --shadow-lg: 0 6px 10px -4px rgba(23,23,23,0.08), 0 16px 24px -6px rgba(23,23,23,0.08);
  }
  html.theme-dark {
    --bg: #1B1C1E; --surface: #212225; --surface-hover: #2E2F33;
    --border: rgba(112,115,124,0.30);
    --text: #F7F7F8; --text-secondary: #AEB0B6;
    --accent: #3385FF; --accent-secondary: #989BA2;
    --accent-strong: #1A75FF; --accent-soft: rgba(51,133,255,0.16);
    --positive: #1ED45A; --negative: #FF6363; --warning: #FFA938;
    --shadow-sm: 0 2px 4px -2px rgba(0,0,0,0.40), 0 4px 6px -1px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 6px -2px rgba(0,0,0,0.45), 0 10px 15px -3px rgba(0,0,0,0.40);
    --shadow-lg: 0 8px 14px -4px rgba(0,0,0,0.55), 0 18px 28px -8px rgba(0,0,0,0.45);
  }
  html, body { width: 1280px; height: 720px; }
  body { font-family: 'Wanted Sans Variable', 'Wanted Sans', 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; overflow: hidden; word-break: keep-all; }
  h1, h2, h3, h4 { color: var(--text); line-height: 1.2; letter-spacing: -0.03em; }
  .artboard { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  .stage { position: relative; z-index: 1; height: 100%; padding: 64px 96px 60px; display: flex; flex-direction: column; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; }
  .chap-badge { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .chap-badge .cn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--accent); color: #fff; font-weight: 800; font-size: 18px; }
  .chap-badge .ct { font-size: 15px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 7px 15px; border-radius: 999px; }
  .h-title { font-size: 48px; font-weight: 800; line-height: 1.13; letter-spacing: -0.04em; }
  .h-title .hl { color: var(--accent); }
  .credits { text-align: right; }
  .credits .ck { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-secondary); text-transform: uppercase; }
  .credits .cn-name { margin-top: 4px; font-size: 26px; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }

  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; margin-top: 34px; align-items: stretch; flex: 1; }
  .pane { position: relative; border-radius: 20px; padding: 30px 30px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }
  .pane.bad { background: var(--surface); border: 1px solid var(--border); }
  .pane.good { background: var(--accent-soft); border: 1.5px solid color-mix(in srgb, var(--accent) 50%, transparent); }
  .pane .pico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 18px; }
  .pane.bad .pico { background: var(--surface-hover); color: var(--text-secondary); }
  .pane.good .pico { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .pane .pk { font-size: 14px; font-weight: 700; letter-spacing: 0.03em; margin-bottom: 8px; }
  .pane.bad .pk { color: var(--text-secondary); }
  .pane.good .pk { color: var(--accent); }
  .pane h3 { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.22; }
  .pane.bad h3 { color: var(--text-secondary); }
  .pane.good h3 { color: var(--accent-strong); }
  html.theme-dark .pane.good h3 { color: #BFD7FF; }
  .pane p { margin-top: 12px; font-size: 18px; line-height: 1.55; }
  .pane.bad p { color: var(--text-secondary); }
  .pane.good p { color: color-mix(in srgb, var(--accent-strong) 76%, var(--text)); }
  html.theme-dark .pane.good p { color: #CFE0FF; }
  .pane .ptag { margin-top: auto; padding-top: 16px; font-size: 14px; font-weight: 700; }
  .pane.bad .ptag { color: var(--text-secondary); }
  .pane.good .ptag { color: var(--accent); }
  .vs-mid { display: grid; place-items: center; }
  .vs-mid .vc { width: 56px; height: 56px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--border); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--text-secondary); box-shadow: var(--shadow-sm); }

  .closing-line { margin-top: 26px; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--text); }
  .closing-line .clh { color: var(--accent); }
  .closing-line .ci { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: 0 0 auto; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate { animation: fadeInUp 0.7s ease-out both; }
  .delay-1 { animation-delay: 0.14s; } .delay-2 { animation-delay: 0.28s; } .delay-3 { animation-delay: 0.42s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .viz-menu { position: fixed; top: 16px; right: 16px; z-index: 9999; }
  .viz-menu-toggle { width: 42px; height: 42px; border-radius: 11px; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  .viz-menu-toggle:hover { background: var(--surface-hover); }
  .viz-menu-dropdown { position: absolute; top: 50px; right: 0; min-width: 188px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 8px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.18s; box-shadow: var(--shadow-lg); }
  .viz-menu-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .viz-menu-dropdown button { width: 100%; padding: 10px 13px; border: none; border-radius: 9px; background: transparent; color: var(--text); font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; }
  .viz-menu-dropdown button:hover { background: var(--surface-hover); }
  .skip-to-content { position: absolute; top: -50px; left: 6px; background: var(--accent); color: #fff; padding: 8px 12px; text-decoration: none; border-radius: 8px; z-index: 10000; }
  .skip-to-content:focus { top: 6px; }
  @media print { @page { size: 1280px 720px; margin: 0; } .viz-menu { display: none; } }
</style>
</head>
<body>
<a href="#main-content" class="skip-to-content">본문으로 건너뛰기</a>
<nav class="viz-menu" aria-label="유틸리티 메뉴">
  <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="메뉴 열기" aria-haspopup="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="viz-menu-dropdown" id="vizMenuDropdown" role="menu">
    <button onclick="cycleTheme()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg> 테마 전환</button>
    <button onclick="downloadImage()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PNG 저장</button>
    <button onclick="window.print()" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> 인쇄 / PDF</button>
  </div>
</nav>

<main id="main-content">
<section class="artboard" aria-label="2강 — 내 인생이라는 영화의 연출자">
  <div class="stage">
    <div class="top">
      <div class="col-l">
        <div class="chap-badge animate"><span class="cn">2</span><span class="ct">2강 · 핵심 비유</span></div>
        <h1 class="h-title animate">내 인생이라는<br><span class="hl">영화의 연출자</span></h1>
      </div>
      <div class="credits animate delay-1">
        <div class="ck">— 엔딩 크레딧 —</div>
        <div class="cn-name">하나님</div>
      </div>
    </div>

    <div class="vs">
      <article class="pane bad animate delay-1">
        <div class="pico" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.5"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg></div>
        <div class="pk">사람의 연출 — 트루먼쇼</div>
        <h3>허술해서<br>옥의 티가 가득</h3>
        <p>아무리 정교하게 짜도, 사람의 기획에는 빈틈이 드러납니다</p>
        <div class="ptag">사람의 기획으로는 못 하는 일</div>
      </article>

      <div class="vs-mid animate delay-2"><span class="vc">VS</span></div>

      <article class="pane good animate delay-3">
        <div class="pico" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="M2 12h4"/><circle cx="12" cy="12" r="4"/><path d="m16.24 7.76 2.83-2.83"/><path d="M18 12h4"/></svg></div>
        <div class="pk">하나님의 연출</div>
        <h3>한 치 오차 없이<br>경영하신다</h3>
        <p>내 인생을 처음부터 끝까지 섭리로 빈틈없이 이끄십니다</p>
        <div class="ptag">하나님만이 내 인생을 경영하신다</div>
      </article>
    </div>

    <div class="closing-line animate delay-3">
      <span class="ci" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg></span>
      인생 엔딩 크레딧에 올라갈 단 한 이름 — <span class="clh">하나님</span>
    </div>
  </div>
</section>
</main>

<script>
  var THEME_KEY = 'viz-theme';
  function applyTheme(t) { document.documentElement.className = 'theme-' + t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  function cycleTheme() { var cur = document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light'; applyTheme(cur === 'dark' ? 'light' : 'dark'); }
  function toggleMenu() { document.getElementById('vizMenuDropdown').classList.toggle('open'); }
  function downloadImage() { var node = document.querySelector('.artboard'); if (typeof htmlToImage === 'undefined') return; htmlToImage.toPng(node, { pixelRatio: 2, width: 1280, height: 720 }).then(function (url) { var a = document.createElement('a'); a.download = 'slide-09.png'; a.href = url; a.click(); }); }
  (function () { try { var s = localStorage.getItem(THEME_KEY); if (s) applyTheme(s); } catch (e) {} })();
  document.addEventListener('click', function (e) { if (!e.target.closest('.viz-menu')) { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var d = document.getElementById('vizMenuDropdown'); if (d) d.classList.remove('open'); } });
</script>
</body>
</html>
