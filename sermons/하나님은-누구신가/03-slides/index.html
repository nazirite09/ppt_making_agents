<!DOCTYPE html>
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하나님은 누구신가 — 교리설교 2강 · 슬라이드 미리보기 (21장)</title>
<link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html.theme-light {
    --bg: #F7F7F8; --surface: #FFFFFF; --surface-hover: #F4F4F5;
    --border: rgba(112,115,124,0.22);
    --text: #171719; --text-secondary: #5A5C63;
    --accent: #0066FF; --accent-secondary: #70737C;
    --positive: #00BF40; --negative: #FF4242; --warning: #FF9200;
    --accent-soft: #EAF2FE;
    --shadow-sm: 0 2px 4px -2px rgba(23,23,23,0.06), 0 4px 6px -1px rgba(23,23,23,0.05);
    --shadow-md: 0 4px 6px -2px rgba(23,23,23,0.07), 0 10px 15px -3px rgba(23,23,23,0.07);
    --shadow-lg: 0 6px 10px -4px rgba(23,23,23,0.08), 0 16px 24px -6px rgba(23,23,23,0.08);
  }
  html.theme-dark {
    --bg: #141415; --surface: #1B1C1E; --surface-hover: #2E2F33;
    --border: rgba(112,115,124,0.30);
    --text: #F7F7F8; --text-secondary: #AEB0B6;
    --accent: #3385FF; --accent-secondary: #989BA2;
    --positive: #1ED45A; --negative: #FF6363; --warning: #FFA938;
    --accent-soft: rgba(51,133,255,0.16);
    --shadow-sm: 0 2px 4px -2px rgba(0,0,0,0.40), 0 4px 6px -1px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 6px -2px rgba(0,0,0,0.45), 0 10px 15px -3px rgba(0,0,0,0.40);
    --shadow-lg: 0 8px 14px -4px rgba(0,0,0,0.55), 0 18px 28px -8px rgba(0,0,0,0.45);
  }
  body {
    font-family: 'Wanted Sans Variable','Wanted Sans','Pretendard Variable',Pretendard,
                 -apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; word-break: keep-all;
    transition: background .3s, color .3s;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px);} to {opacity:1; transform:translateY(0);} }
  .animate { animation: fadeUp .6s cubic-bezier(.16,1,.3,1) both; }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

  header.page-head {
    max-width: 1640px; margin: 0 auto; padding: 56px 40px 22px;
  }
  .eyebrow { display:inline-flex; align-items:center; gap:9px; font-size:14px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:8px 16px; border-radius:999px; letter-spacing:0.02em; }
  .eyebrow .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  h1.page-title { font-size:42px; font-weight:800; letter-spacing:-0.04em; margin-top:20px; line-height:1.12; }
  .page-sub { margin-top:12px; font-size:18px; color:var(--text-secondary); font-weight:500; }
  .page-sub b { color:var(--text); font-weight:700; }
  .meta-chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .mchip { font-size:14px; font-weight:600; color:var(--text-secondary); background:var(--surface); border:1px solid var(--border); padding:8px 16px; border-radius:999px; box-shadow:var(--shadow-sm); }
  .mchip b { color:var(--accent); font-weight:700; }

  main { max-width: 1640px; margin: 0 auto; padding: 16px 40px 80px; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
  }
  .thumb {
    display:block; text-decoration:none; color:inherit;
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; box-shadow: var(--shadow-sm);
    transition: box-shadow .25s, transform .25s, border-color .25s;
  }
  .thumb:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .frame-wrap {
    position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  /* 1920×1080 아트보드를 썸네일 폭에 맞게 축소 — 폭 기준 스케일 */
  .frame-wrap iframe {
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    border:0; transform-origin: top left; pointer-events:none;
  }
  .thumb-meta { display:flex; align-items:center; gap:12px; padding:14px 18px; }
  .tnum { flex:0 0 auto; width:40px; height:40px; border-radius:11px; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:17px; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
  .tinfo { min-width:0; }
  .ttitle { font-size:16px; font-weight:700; letter-spacing:-0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ttype { font-size:13px; color:var(--text-secondary); font-weight:500; margin-top:2px; }
  .ttype .slot { color:var(--accent); font-weight:700; }

  /* 파트 구분 헤더 행 */
  .part-row { grid-column: 1 / -1; display:flex; align-items:center; gap:16px; margin-top:18px; }
  .part-row:first-child { margin-top:0; }
  .part-row .pl { font-size:15px; font-weight:800; letter-spacing:0.06em; color:var(--accent); text-transform:uppercase; white-space:nowrap; }
  .part-row .pt { font-size:18px; font-weight:700; color:var(--text); white-space:nowrap; }
  .part-row .line { flex:1; height:1px; background:var(--border); }

  /* viz utility menu */
  .viz-menu { position: fixed; top: 18px; right: 18px; z-index: 9999; }
  .viz-menu-toggle { width:46px; height:46px; border-radius:13px; background:var(--surface); border:1px solid var(--border); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); transition: background .2s; }
  .viz-menu-toggle:hover { background: var(--surface-hover); }
  .viz-menu-dropdown { position:absolute; top:54px; right:0; min-width:210px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px; opacity:0; visibility:hidden; transform:translateY(-8px); transition:all .2s; box-shadow:var(--shadow-lg); }
  .viz-menu-dropdown.open { opacity:1; visibility:visible; transform:translateY(0); }
  .viz-menu-dropdown button { width:100%; padding:11px 14px; border:none; border-radius:9px; background:transparent; color:var(--text); font-size:14px; font-family:inherit; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:11px; transition: background .15s; }
  .viz-menu-dropdown button:hover { background: var(--surface-hover); }
  .skip-to-content { position:absolute; top:-50px; left:6px; background:var(--accent); color:#fff; padding:8px 12px; text-decoration:none; border-radius:8px; z-index:10000; transition: top .2s; }
  .skip-to-content:focus { top:6px; }

  @media (max-width: 1100px){ .grid { grid-template-columns: repeat(2,1fr);} }
  @media (max-width: 720px){ .grid { grid-template-columns: 1fr;} main, header.page-head { padding-left:18px; padding-right:18px;} h1.page-title{font-size:32px;} }
  @media (max-width: 375px){ body { overflow-x: hidden; } }
  @media print {
    .viz-menu, .skip-to-content { display:none !important; }
    body { background:#fff; color:#000; }
    .grid { grid-template-columns: repeat(2,1fr); }
    .thumb { break-inside: avoid; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-to-content">본문으로 건너뛰기</a>

<nav class="viz-menu">
  <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="메뉴 열기" aria-haspopup="true">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg>
  </button>
  <div class="viz-menu-dropdown" id="vizMenuDropdown" role="menu">
    <button onclick="cycleTheme()" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>테마 전환 (라이트/다크)</span>
    </button>
    <button onclick="window.print()" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
      <span>인쇄 / PDF</span>
    </button>
    <button onclick="downloadImage()" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span>미리보기 PNG 저장</span>
    </button>
  </div>
</nav>

<header class="page-head">
  <span class="eyebrow animate"><span class="dot"></span>SLIDE PREVIEW · 21장</span>
  <h1 class="page-title animate">하나님은 누구신가 <span style="color:var(--text-secondary);font-weight:700;">— 교리설교 2강</span></h1>
  <p class="page-sub animate">본문 <b>에베소서 1:11</b> · 청소년·청년부 주일 교리설교 · 형식 <b>lecture-deck</b> · 디자인 <b>Montage</b></p>
  <div class="meta-chips animate">
    <span class="mchip">네이티브 <b>1920×1080</b></span>
    <span class="mchip">Part 1 <b>성품</b></span>
    <span class="mchip">Part 2 <b>관계</b></span>
    <span class="mchip">Part 3 <b>내 인생과의 상관</b></span>
    <span class="mchip">썸네일 클릭 → 전체화면 슬라이드</span>
  </div>
</header>

<main id="main-content">
  <div class="grid" id="grid"></div>
</main>

<script>
  var SLIDES = [
    {n:'01', t:'하나님은 누구신가', type:'표지(Title)', slot:'표지', part:'opening'},
    {n:'02', t:'하나님을 알 때, 내 인생이 변합니다', type:'설교 목표', slot:'목표', part:'opening'},
    {n:'03', t:'하나님은 누구십니까?', type:'질문의 재정의(Agenda)', slot:'아젠다', part:'opening'},
    {n:'04', t:'하나님의 성품은 무엇인가', type:'단원구분', slot:'단원구분', part:'p1'},
    {n:'05', t:'당신의 이름은 무엇입니까?', type:'봉독 + 예화[도입]', slot:'번호본문', part:'p1'},
    {n:'06', t:'나는 스스로 있는 자이니라', type:'대지[교리 핵심]', slot:'번호본문', part:'p1'},
    {n:'07', t:'하나님은 어떤 분이십니까?', type:'인용[교리문답·제4문]', slot:'번호본문', part:'p1'},
    {n:'08', t:'존재 자체로 찬양받기 합당하신 분', type:'봉독/대지 + 적용', slot:'번호본문', part:'p1'},
    {n:'09', t:'하나님은 나와 어떤 관계인가', type:'단원구분', slot:'단원구분', part:'p2'},
    {n:'10', t:'하나님은 내 인생을 경영하십니다', type:'대지[교리 핵심] · 본문 회수', slot:'번호본문', part:'p2'},
    {n:'11', t:'내 인생이라는 영화의 연출자', type:'예화(엔딩 크레딧)', slot:'번호본문', part:'p2'},
    {n:'12', t:'트루먼쇼 — 옥의 티로 가득한 연출', type:'예화(2단 대비)', slot:'번호본문', part:'p2'},
    {n:'13', t:'미세조정 우주 — 우연일 수 없는 정교함', type:'인용[근거] + 예화', slot:'번호본문', part:'p2'},
    {n:'14', t:'멀티버스라는 반론, 그래도', type:'예화/논점', slot:'번호본문', part:'p2'},
    {n:'15', t:'그것이 내 인생과 무슨 상관이 있는가', type:'단원구분', slot:'단원구분', part:'p3'},
    {n:'16', t:'큰 위로와 소망이 됩니다', type:'대지[적용 틀]/구조', slot:'번호본문', part:'p3'},
    {n:'17', t:'우리를 상속자 삼으셨습니다', type:'대지[교리 핵심]', slot:'번호본문', part:'p3'},
    {n:'18', t:'아빠 아버지라 부르는 자녀', type:'봉독[근거] · 요1:12·롬8:15', slot:'번호본문', part:'p3'},
    {n:'19', t:'세상 창조 전에, 조건 없이', type:'봉독 + 예화 + 적용', slot:'번호본문', part:'p3'},
    {n:'20', t:'그 계획은 하나님의 성품에서 나옵니다', type:'인용[교리문답·제11문] + 대지', slot:'번호본문', part:'p3'},
    {n:'21', t:'존재의 바다이신 하나님', type:'마무리 + 인용', slot:'마무리', part:'closing'}
  ];
  var PARTS = {
    opening: {pl:'OPENING', pt:'표지 · 목표 · 아젠다'},
    p1: {pl:'PART 1', pt:'하나님의 성품은 무엇인가'},
    p2: {pl:'PART 2', pt:'하나님은 나와 어떤 관계인가'},
    p3: {pl:'PART 3', pt:'그것이 내 인생과 무슨 상관이 있는가'},
    closing: {pl:'CLOSING', pt:'결론 — 존재의 바다'}
  };

  var grid = document.getElementById('grid');
  var lastPart = null;
  SLIDES.forEach(function(s, i){
    if (s.part !== lastPart) {
      var p = PARTS[s.part];
      var row = document.createElement('div');
      row.className = 'part-row';
      row.innerHTML = '<span class="pl">'+p.pl+'</span><span class="pt">'+p.pt+'</span><span class="line"></span>';
      grid.appendChild(row);
      lastPart = s.part;
    }
    var a = document.createElement('a');
    a.className = 'thumb animate';
    a.href = 'slide-' + s.n + '.html';
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', s.n + ' ' + s.t + ' (' + s.type + ')');
    a.innerHTML =
      '<div class="frame-wrap"><iframe src="slide-'+s.n+'.html" loading="lazy" tabindex="-1" title="슬라이드 '+s.n+' 미리보기" scrolling="no"></iframe></div>'+
      '<div class="thumb-meta">'+
        '<span class="tnum">'+s.n+'</span>'+
        '<div class="tinfo"><div class="ttitle">'+s.t+'</div>'+
        '<div class="ttype">'+s.type+' · <span class="slot">'+s.slot+'</span></div></div>'+
      '</div>';
    grid.appendChild(a);
  });

  // 썸네일 iframe 스케일 — 컨테이너 폭/1920 으로 축소
  function scaleThumbs(){
    document.querySelectorAll('.frame-wrap').forEach(function(w){
      var scale = w.clientWidth / 1920;
      var f = w.querySelector('iframe');
      if (f) f.style.transform = 'scale(' + scale + ')';
    });
  }
  window.addEventListener('load', scaleThumbs);
  window.addEventListener('resize', scaleThumbs);
  setTimeout(scaleThumbs, 60);

  // ===== theme =====
  function applyTheme(t){ document.documentElement.className = 'theme-' + t; try{ localStorage.setItem('viz-theme', t); }catch(e){} }
  function cycleTheme(){
    var cur = document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }
  (function(){
    var saved = null; try { saved = localStorage.getItem('viz-theme'); } catch(e){}
    if (saved) applyTheme(saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
    else applyTheme('light');
  })();

  // ===== menu =====
  function toggleMenu(){ document.getElementById('vizMenuDropdown').classList.toggle('open'); }
  document.addEventListener('click', function(e){
    var dd = document.getElementById('vizMenuDropdown');
    if (!e.target.closest('.viz-menu') && dd) dd.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ var dd=document.getElementById('vizMenuDropdown'); if(dd) dd.classList.remove('open'); } });

  // ===== download preview PNG =====
  function downloadImage(){
    var dd = document.getElementById('vizMenuDropdown'); if (dd) dd.classList.remove('open');
    if (typeof htmlToImage === 'undefined'){ window.print(); return; }
    htmlToImage.toPng(document.body, { backgroundColor: getComputedStyle(document.body).backgroundColor, pixelRatio: 1.5 })
      .then(function(url){ var a=document.createElement('a'); a.download='하나님은-누구신가-미리보기.png'; a.href=url; a.click(); })
      .catch(function(){ window.print(); });
  }
</script>
</body>
</html>
