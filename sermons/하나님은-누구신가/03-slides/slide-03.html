<!DOCTYPE html>
<!-- slide #03 · type: 질문의 재정의(Agenda) · slot: 아젠다 -->
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<title>03 · 질문의 재정의</title>
<link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>
  /* 아젠다 — 상단 중앙 제목, 아래 심화 스텝퍼 */
  .agenda-head { text-align:center; margin-top: 4px; }
  .agenda-head .pill { margin-bottom: 24px; }
  .agenda-head h1 { font-size: 72px; font-weight:800; letter-spacing:-0.04em; line-height:1.1; }
  .agenda-head h1 em { color: var(--accent); }
  .agenda-head .sub { margin-top:18px; font-size:28px; font-weight:500; color:var(--text-secondary); }
</style>
</head>
<body>
<main id="main-content">
<section class="slide" data-fmt-slot="아젠다" aria-label="질문의 재정의 — 세 가지 질문">
  <div class="fullbleed light"></div>

  <span class="fmt-idmark" data-fmt="idmark"><span class="dot"></span>교리설교 2강</span>

  <div class="fb-pad" style="padding:88px 120px; display:flex; flex-direction:column; justify-content:center;">
    <header class="agenda-head animate d1">
      <span class="pill">질문의 재정의</span>
      <h1>하나님은 <em>누구</em>십니까?</h1>
      <p class="sub">올바른 답은 올바른 질문에서 &mdash; 세 질문이 한 걸음씩 깊어집니다.</p>
    </header>

    <div class="stepper" style="margin-top:52px;">
      <div class="step s1 animate d2">
        <span class="si">①</span>
        <h3>하나님의 성품은 무엇인가</h3>
        <span class="sx">Part 1</span>
      </div>
      <div class="step s2 animate d3">
        <span class="si">②</span>
        <h3>하나님은 나와 어떤 관계인가</h3>
        <span class="sx">Part 2</span>
      </div>
      <div class="step s3 animate d4">
        <span class="si">③</span>
        <h3>그것이 내 인생과 무슨 상관이 있는가</h3>
        <span class="sx">Part 3</span>
      </div>
    </div>
  </div>

  <span class="fmt-pagenum" data-fmt="pagenum">03<b> / </b>21</span>
</section>
</main>
</body>
</html>
