<!DOCTYPE html>
<!-- slide #11 · type: 예화 (엔딩 크레딧) · slot: 번호본문 (Part 2) -->
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<title>11 · 내 인생이라는 영화의 연출자</title>
<link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>
  .credits { display:flex; gap:36px; align-items:stretch; width:100%; max-width:1560px; margin:0 auto; }
  .credit-roll {
    flex: 1 1 0; background: var(--surface); border:1px solid var(--border); border-radius:22px;
    box-shadow: var(--shadow-sm); padding: 34px 40px; text-align:left;
    display:flex; flex-direction:column; justify-content:center;
  }
  .credit-roll .ch { font-size:19px; font-weight:700; letter-spacing:0.14em; color:var(--accent-secondary); text-transform:uppercase; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
  .roll-list { display:grid; grid-template-columns:1fr 1fr; gap:14px 36px; }
  .roll-list .ri { display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dashed var(--border); padding-bottom:11px; }
  .roll-list .ri .role { font-size:24px; font-weight:600; color:var(--text-secondary); letter-spacing:0.02em; }
  .roll-list .ri .who { font-size:22px; font-weight:700; color:var(--accent); }
  .credit-card {
    flex: 0 0 480px; background: var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 50%, transparent);
    border-radius:22px; padding: 44px; box-shadow: var(--shadow-md); text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  .credit-card .cc-ico { width:84px; height:84px; border-radius:24px; background:#FFFFFF; color:var(--accent); display:grid; place-items:center; }
  .credit-card .cc-t { font-size:25px; font-weight:600; color:#2B4D80; line-height:1.4; }
  .credit-card .cc-b { font-size:46px; font-weight:800; color:var(--accent-strong); letter-spacing:-0.03em; line-height:1.1; }
</style>
</head>
<body>
<main id="main-content">
<section class="slide" data-fmt-slot="번호본문" aria-label="내 인생이라는 영화의 연출자 — 엔딩 크레딧">
  <div class="fullbleed light"></div>

  <header class="fmt-header">
    <div class="fmt-kicker" data-fmt="kicker">하나님은 누구신가</div>
    <div class="fmt-unitline">
      <span class="fmt-unitno" data-fmt="unit-no">02</span>
      <span class="fmt-unittitle" data-fmt="unit-title">하나님은 나와 어떤 관계인가</span>
    </div>
  </header>
  <span class="fmt-idmark" data-fmt="idmark"><span class="dot"></span>교리설교 2강</span>

  <div class="body-area center">
    <h2 class="headline animate d1">내 인생이라는 영화의 <em>연출자</em></h2>
    <p class="subcap animate d2">한 편을 만든 모든 이름이 오르는 엔딩 크레딧 &mdash; 내 인생의 크레딧에는?</p>

    <div class="body-stack" style="margin-top:46px;">
      <div class="credits">
        <div class="credit-roll animate d3">
          <span class="ch">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M17 9h5M2 15h5M17 15h5"/></svg>
            Ending Credits
          </span>
          <div class="roll-list">
            <div class="ri"><span class="role">투자</span><span class="who">하나님</span></div>
            <div class="ri"><span class="role">기획</span><span class="who">하나님</span></div>
            <div class="ri"><span class="role">각본</span><span class="who">하나님</span></div>
            <div class="ri"><span class="role">연출</span><span class="who">하나님</span></div>
            <div class="ri"><span class="role">음향</span><span class="who">하나님</span></div>
            <div class="ri"><span class="role">미술</span><span class="who">하나님</span></div>
            <div class="ri"><span class="role">배급</span><span class="who">하나님</span></div>
            <div class="ri"><span class="role">총판</span><span class="who">하나님</span></div>
          </div>
        </div>
        <div class="credit-card animate d4">
          <span class="cc-ico"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 4 4M4 8l4-4M2 12h6M2 16l4-4 4 4"/><circle cx="16" cy="14" r="6"/><path d="M16 11v3l2 1"/></svg></span>
          <p class="cc-t">투자·기획·각본·연출·음향·미술·배급까지</p>
          <p class="cc-b">하나님 한 분의<br>이름</p>
        </div>
      </div>
    </div>
  </div>

  <span class="fmt-pagenum" data-fmt="pagenum">11<b> / </b>21</span>
</section>
</main>
</body>
</html>
