<style>
  .mv-claim {
    width:100%; max-width:1300px; margin:0 auto; text-align:center;

  .fork .opt {

  .fork .vsdot { font-size:26px; font-weight:800; color:var(--accent-secondary); }
  .fork-q { margin-top:32px; text-align:center; font-size:30px; font-weight:600; color:var(--text); }
